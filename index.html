<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>Cold Vault</title>
<meta name="description" content="实时 3D、零重力标本，以及被封存的创作实验。" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<script>document.body.classList.add('is-loading');</script>

<canvas id="gl" aria-label="由88枚独立磁体构成、可拖动旋转并点击重组的三维装置"></canvas>
<div class="scrim" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="chrome chrome-top">
  <a class="brand" href="#top" data-scroll="0" aria-label="返回首屏">
    <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1 27 14 14 27 1 14Z"/><path d="M14 7v14M7 14h14"/></svg>
    <span class="brand-type"><b>COLD VAULT</b></span>
  </a>
  <nav class="nav" aria-label="章节导航">
    <button class="is-active" data-goto="0"><i>00</i><span>首页</span></button>
    <button data-goto="1"><i>01</i><span>标本</span></button>
    <button data-goto="2"><i>02</i><span>作品</span></button>
    <button data-goto="3"><i>03</i><span>联系</span></button>
  </nav>
  <div class="local-time"><span class="status-dot"></span><span>SHANGHAI</span><time id="clock">--:--:--</time></div>
</header>

<aside class="chapter-rail" aria-hidden="true">
  <span id="chapter-current">01</span>
  <div class="chapter-track"><i id="chapter-progress"></i></div>
  <span>04</span>
</aside>

<footer class="chrome chrome-bottom">
  <div class="meta"><span class="live-dot"></span> ARCHIVE ONLINE</div>
  <div class="meta meta-right"><button class="q-btn" id="q-btn" type="button">画质：自动</button></div>
</footer>

<main id="scroller">
  <section class="sec sec-hero" id="top" data-sec="0">
    <div class="hero-copy">
      <h1 class="display" aria-label="Cold Vault">
        <span class="display-line">Cold</span>
        <span class="display-line display-italic">Vault</span>
      </h1>
      <div class="hero-bottom">
        <button class="enter-link" type="button" data-scroll="2"><span>进入收藏层</span><i>↘</i></button>
      </div>
    </div>
  </section>

  <section class="sec sec-archive" data-sec="1">
    <div class="section-copy">
      <h2 class="h2">无序，<br /><em>亦有引力。</em></h2>
      <button class="field-button" id="burst-btn" type="button"><span>释放约束场</span><b>＋</b></button>
    </div>
  </section>

  <section class="sec sec-works" data-sec="2">
    <div class="works-column">
      <div class="works-head">
        <h2 class="h2">封存清单</h2>
      </div>
      <ol class="works-list" id="works">
        <li><button type="button" data-project="4"><span class="w-name">Fly, My Wings</span><span class="w-year">2026</span><span class="w-arrow">↗</span></button></li>
        <li><button type="button" data-project="0"><span class="w-name">P5R 合成工具</span><span class="w-year">2026</span><span class="w-arrow">↗</span></button></li>
        <li><button type="button" data-project="1"><span class="w-name">零度以下</span><span class="w-year">2025</span><span class="w-arrow">↗</span></button></li>
        <li><button type="button" data-project="2"><span class="w-name">第二次碎裂</span><span class="w-year">2025</span><span class="w-arrow">↗</span></button></li>
        <li><button type="button" data-project="3"><span class="w-name">没有窗口的房间</span><span class="w-year">2024</span><span class="w-arrow">↗</span></button></li>
      </ol>
    </div>
  </section>

  <section class="sec sec-contact" data-sec="3">
    <div class="section-copy contact-copy">
      <h2 class="h2 contact-h2">让下一次实验，<br />不止于<em>被收藏。</em></h2>
      <a class="mail" href="mailto:18239690584@163.com"><span>18239690584@163.com</span><i>↗</i></a>
    </div>
    <p class="copyright">© 2026 COLD VAULT</p>
  </section>
</main>

<dialog class="project-dialog" id="project-dialog" aria-labelledby="project-title">
  <button class="dialog-close" id="dialog-close" type="button" aria-label="关闭作品详情">×</button>
  <h2 id="project-title">静态场</h2>
  <div class="project-visual" id="project-visual" aria-label="作品预览"><video class="project-media" id="project-video" controls playsinline preload="none" aria-label="Fly, My Wings 影像预览" hidden></video><img class="project-media" id="project-image" alt="" hidden /><span></span><i></i><b id="project-visual-code">01</b></div>
  <p class="project-description" id="project-description"></p>
</dialog>

<div class="cursor" id="cursor" aria-hidden="true"><span></span><b id="cursor-label"></b></div>

<div class="preloader" id="preloader" role="status" aria-live="polite">
  <div class="pl-top"><span>COLD VAULT</span><span>PRIVATE DIGITAL ARCHIVE</span></div>
  <div class="pl-centre"><span>正在开启收藏层</span><i></i></div>
  <div class="pl-inner">
    <div><div class="pl-count"><span id="pl-num">000</span><i>%</i></div><div class="pl-status" id="pl-status">正在密封库房</div></div>
    <div class="pl-bar"><span id="pl-fill"></span><i class="pl-sweep"></i></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
